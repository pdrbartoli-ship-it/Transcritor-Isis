name: Build Desktop (Windows)

# Compila o app nativo Windows (Tauri) numa máquina windows-latest do
# GitHub e publica o instalador como asset de uma GitHub Release — assim
# vira um link de download público e direto (sem exigir login no GitHub e
# sem baixar um .zip de "artefato de CI"), pronto pra colocar na landing.
#
# A tag "desktop-latest" é fixa e sobrescrita a cada build: o link do
# instalador nunca muda. É o plano B da landing (InstalarWindows.jsx), para os
# computadores em que o instalador da Microsoft Store falha. Sem assinatura de
# código (decisão de 25/09/2026): o Windows avisa "O Windows protegeu o
# computador" na primeira execução, e a landing mostra onde clicar.
#
# Só roda quando o executável muda. A janela do app abre o site publicado (ver
# tauri.conf.json), então mudança de web chega sem instalador novo. E cada
# build é um arquivo que o SmartScreen nunca viu: rodar a cada push em
# frontend/** jogava fora, várias vezes por dia, a reputação que o arquivo
# anterior tinha começado a juntar.
on:
  workflow_dispatch:
  push:
    branches: [main, app-nativo-windows]
    paths:
      - 'frontend/src-tauri/**'
      - '.github/workflows/build-desktop.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # O manifesto do MSIX só era conferido no fim, pelo makeappx, depois de
      # seis minutos de compilação — e um comentário XML com dois hifens
      # seguidos derrubou o build 96 exatamente assim. Aqui a checagem custa um
      # segundo e falha antes de qualquer coisa cara.
      - name: Conferir o manifesto do MSIX
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [xml](Get-Content frontend/src-tauri/msix/AppxManifest.xml -Raw) | Out-Null
          'AppxManifest.xml é XML válido'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache do Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri -> target

      - name: Instalar dependências do frontend
        run: cd frontend && npm install

      - name: Compilar o app nativo
        run: cd frontend && npx tauri build

      # A regra do detector de reunião (quem está com o microfone, por quanto
      # tempo, o que vale como reunião) é lógica pura em src/meeting/estado.rs,
      # e é a única parte dele que dá para provar sem uma máquina com Zoom
      # aberto. Roda depois do build de propósito: assim reaproveita tudo o que
      # já foi compilado, e falha antes de qualquer publicação.
      - name: Testes do Rust
        run: cd frontend/src-tauri && cargo test

      # O nome que o Tauri gera carrega a versão (Dito_0.1.0_x64-setup.exe), e a
      # landing precisa de um link fixo. Publicar também uma cópia com nome
      # estável evita que subir a versão quebre o botão "Baixar o app" — que já
      # tinha acontecido, daí o aviso no comentário do Landing.jsx. O `-t` pega
      # o mais novo: em ordem alfabética, um instalador de versão anterior que
      # sobrasse na pasta ganharia do recém-gerado.
      - name: Duplicar instalador com nome estável
        shell: bash
        run: |
          cd frontend/src-tauri/target/release/bundle/nsis
          cp "$(ls -t *-setup.exe | head -1)" Dito-setup.exe

      - name: Publicar instalador na Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-latest
          name: Dito para Windows
          body: |
            Instalador do Dito para Windows, gerado a partir do commit ${{ github.sha }}.

            Instalador sem assinatura digital: na primeira execução o Windows
            mostra "O Windows protegeu o computador". Clique em "Mais
            informações" e depois em "Executar assim mesmo".
          prerelease: true
          files: frontend/src-tauri/target/release/bundle/nsis/*.exe

      # ── Pacote MSIX para a Microsoft Store ──────────────────────────────
      # O mesmo Dito compilado acima, empacotado como MSIX. Enviado à Store
      # nesse formato (e não como o instalador .exe), o pacote é assinado pela
      # própria Microsoft: sem pagar certificado e sem o aviso "O Windows
      # protegeu seu PC". Manifesto e ícones moram em frontend/src-tauri/msix.
      #
      # makeappx e signtool já vêm no Windows SDK do runner — é o que o winapp
      # CLI da Microsoft usa por baixo, sem precisar instalar nada.
      - name: Montar o pacote MSIX
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $raiz = 'frontend/src-tauri'
          $exe = "$raiz/target/release/app.exe"
          if (-not (Test-Path $exe)) {
            Get-ChildItem "$raiz/target/release" -Filter *.exe | Format-Table Name
            throw 'app.exe não encontrado em target/release'
          }

          # Regras da Store para a versão: o último campo zerado (é dela) e o
          # primeiro diferente de zero — "0.1.x.0" instala num PC mas é recusado
          # no envio. O número da execução do workflow cresce sozinho, e é o que
          # garante versão maior a cada build.
          $versao = "1.0.${{ github.run_number }}.0"

          $layout = 'msix-layout'
          New-Item -ItemType Directory -Force "$layout/Assets" | Out-Null
          Copy-Item $exe "$layout/Dito.exe"
          Copy-Item "$raiz/msix/Assets/*" "$layout/Assets/"
          (Get-Content "$raiz/msix/AppxManifest.xml" -Raw).Replace('__VERSION__', $versao) |
            Set-Content "$layout/AppxManifest.xml" -Encoding utf8

          $makeappx = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\10.*\x64\makeappx.exe' |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $makeappx) { throw 'makeappx.exe não encontrado no Windows SDK do runner' }
          "SDK_BIN=$($makeappx.DirectoryName)" | Out-File -Append $env:GITHUB_ENV
          "MSIX_VERSAO=$versao" | Out-File -Append $env:GITHUB_ENV

          New-Item -ItemType Directory -Force msix-saida | Out-Null
          & $makeappx.FullName pack /d $layout /p msix-saida/Dito-store.msix /o
          if ($LASTEXITCODE -ne 0) { throw 'makeappx falhou' }

      # Cópia assinada com um certificado de teste, só para instalar num PC fora
      # da Store: a gravação das duas vozes precisa ser provada numa máquina de
      # verdade antes do envio. O certificado nasce a cada build (a senha não é
      # segredo, ele não vale para nada além disso) e o assunto dele tem de ser
      # igual ao Publisher do manifesto. Esta cópia NÃO vai para a Store.
      - name: Assinar cópia de teste
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cert = New-SelfSignedCertificate -Type Custom `
            -Subject 'CN=83C50F24-B6E7-4443-A4B7-95AFDF314BFA' `
            -KeyUsage DigitalSignature -FriendlyName 'Dito (teste)' `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
          $senha = ConvertTo-SecureString -String 'dito-teste' -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath teste.pfx -Password $senha | Out-Null
          Export-Certificate -Cert $cert -FilePath msix-saida/Dito-teste.cer | Out-Null
          Copy-Item msix-saida/Dito-store.msix msix-saida/Dito-teste.msix
          & "$env:SDK_BIN\signtool.exe" sign /fd SHA256 /f teste.pfx /p dito-teste msix-saida/Dito-teste.msix
          if ($LASTEXITCODE -ne 0) { throw 'signtool falhou' }

      # Release separada da "desktop-latest": o link de download da landing
      # continua apontando para o instalador .exe até o Dito estar na Store.
      - name: Publicar pacotes MSIX na Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-store
          name: Dito para a Microsoft Store (pacotes)
          body: |
            Versão ${{ env.MSIX_VERSAO }}, a partir do commit ${{ github.sha }}.

            - **Dito-store.msix** — o arquivo que se envia no Partner Center. Sem assinatura: quem assina é a Store.
            - **Dito-teste.msix** e **Dito-teste.cer** — cópia assinada com um certificado de teste, para instalar num PC antes do envio. Primeiro instale o .cer em "Pessoas Confiáveis" do computador local; depois abra o .msix.
          prerelease: true
          files: |
            msix-saida/Dito-store.msix
            msix-saida/Dito-teste.msix
            msix-saida/Dito-teste.cer

      # Prova, no próprio runner, que o pacote instala e que o Dito abre pela
      # identidade do pacote. Vem depois da publicação de propósito: se falhar,
      # os arquivos já estão lá para investigar. A gravação não dá para testar
      # aqui — a máquina do CI não tem dispositivo de áudio.
      - name: Instalar e abrir o pacote de teste
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Certificate -FilePath msix-saida/Dito-teste.cer -CertStoreLocation 'Cert:\LocalMachine\TrustedPeople' | Out-Null
          Add-AppxPackage -Path msix-saida/Dito-teste.msix
          $pacote = Get-AppxPackage -Name 'AlbieCloud.57831C11EA014'
          if (-not $pacote) { throw 'o pacote não aparece como instalado' }
          "Instalado: $($pacote.PackageFullName)"
          "Family name: $($pacote.PackageFamilyName)"

          Start-Process "shell:AppsFolder\$($pacote.PackageFamilyName)!Dito"
          Start-Sleep -Seconds 20
          $processo = Get-Process -Name Dito -ErrorAction SilentlyContinue
          if (-not $processo) { throw 'o Dito não estava aberto 20 s depois de iniciado pelo pacote' }
          "Dito aberto pelo pacote (PID $($processo.Id))"

          $processo | Stop-Process -Force
          Remove-AppxPackage -Package $pacote.PackageFullName
