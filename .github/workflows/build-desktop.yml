name: Build Desktop (Windows)

# Compila o app nativo Windows (Tauri) numa máquina windows-latest do
# GitHub e publica o instalador como asset de uma GitHub Release — assim
# vira um link de download público e direto (sem exigir login no GitHub e
# sem baixar um .zip de "artefato de CI"), pronto pra colocar na landing.
#
# A tag "desktop-latest" é fixa e sobrescrita a cada build: enquanto o app
# nativo estiver em teste, é sempre o mesmo link que aponta pro build mais
# recente. Sem assinatura de código ainda (custa dinheiro, fica pra depois
# — ver plano de migração): o Windows ainda avisa "protegeu seu PC" na
# primeira execução, isso é esperado.
on:
  workflow_dispatch:
  push:
    branches: [main, app-nativo-windows]
    paths:
      - 'frontend/**'
      - '.github/workflows/build-desktop.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache do Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri -> target

      - name: Instalar dependências do frontend
        run: cd frontend && npm install

      - name: Compilar o app nativo
        run: cd frontend && npx tauri build

      # O nome que o Tauri gera carrega a versão (Dito_0.1.0_x64-setup.exe), e a
      # landing precisa de um link fixo. Publicar também uma cópia com nome
      # estável evita que subir a versão quebre o botão "Baixar o app" — que já
      # tinha acontecido, daí o aviso no comentário do Landing.jsx.
      - name: Duplicar instalador com nome estável
        shell: bash
        run: |
          cd frontend/src-tauri/target/release/bundle/nsis
          cp "$(ls *-setup.exe | head -1)" Dito-setup.exe

      - name: Publicar instalador na Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-latest
          name: Dito para Windows (build de teste)
          body: |
            Build automático a partir do commit ${{ github.sha }}, gerado pelo
            GitHub Actions — não é uma versão oficial ainda.

            Instalador sem assinatura digital: o Windows vai avisar
            "O Windows protegeu o computador" na primeira execução — clique em
            "Mais informações" e depois em "Executar assim mesmo".
          prerelease: true
          files: frontend/src-tauri/target/release/bundle/nsis/*.exe
