name: Build Desktop (Windows)

# Compila o app nativo Windows (Tauri) numa máquina windows-latest do
# GitHub e disponibiliza o instalador pra download — assim ninguém precisa
# instalar Rust/Visual Studio na própria máquina só pra testar.
#
# Sem assinatura de código ainda (fica pra depois — ver plano de migração):
# o Windows vai avisar "protegeu seu PC" na primeira execução do instalador,
# isso é esperado.
on:
  workflow_dispatch:
  push:
    branches: [app-nativo-windows]
    paths:
      - 'frontend/**'
      - '.github/workflows/build-desktop.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache do Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri -> target

      - name: Instalar dependências do frontend
        run: cd frontend && npm install

      - name: Compilar o app nativo
        run: cd frontend && npx tauri build

      - name: Publicar instalador
        uses: actions/upload-artifact@v4
        with:
          name: dito-windows-installer
          path: |
            frontend/src-tauri/target/release/bundle/msi/*.msi
            frontend/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
