name: Keep Backend Awake

# O backend roda no plano gratuito do Render, que hiberna depois de ~15min
# sem receber requisição — o próximo envio de arquivo então esbarra num cold
# start de 30-60s. Uma cutucada leve e periódica no endpoint raiz evita a
# hibernação, sem custo e sem tocar no código do backend.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: curl -fsS --max-time 30 https://transcritor-backend.onrender.com/
