name: Deploy Frontend

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package.json
      - name: Install
        run: cd frontend && npm install

      # O bundle do app usa base relativa (CAPACITOR=1); o do site usa o
      # subcaminho do Pages. São builds diferentes, então o do app vem primeiro
      # e é empacotado antes de o dist ser sobrescrito.
      - name: Build OTA bundle (app)
        id: ota
        run: |
          cd frontend
          npm run build:app
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          # O zip precisa do index.html na raiz — daí o "cd dist".
          (cd dist && zip -qr "../bundle-${VERSION}.zip" .)
          CHECKSUM=$(sha256sum "bundle-${VERSION}.zip" | cut -d' ' -f1)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "checksum=${CHECKSUM}" >> "$GITHUB_OUTPUT"

      - name: Build site
        run: cd frontend && npm run build

      - name: Publish OTA manifest
        env:
          VERSION: ${{ steps.ota.outputs.version }}
          CHECKSUM: ${{ steps.ota.outputs.checksum }}
        run: |
          cd frontend
          BASE="https://pdrbartoli-ship-it.github.io/Transcritor-Isis/ota"
          mkdir -p dist/ota
          mv "bundle-${VERSION}.zip" dist/ota/
          cat > dist/ota/latest.json <<EOF
          {
            "version": "${VERSION}",
            "url": "${BASE}/bundle-${VERSION}.zip",
            "checksum": "${CHECKSUM}"
          }
          EOF
          cat dist/ota/latest.json

      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist/
      - uses: actions/deploy-pages@v4
        id: deployment
