    <title>Dito: transcreve e resume qualquer conversa</title>
    <script>
      // Apply saved theme before render to avoid a flash of the wrong theme.
      (function () {
        var t = 'light';
        try { t = localStorage.getItem('dito-theme') || 'light'; } catch (e) {}
        document.documentElement.setAttribute('data-theme', t);
        // A barra do PWA instalado sai do theme-color, e o Chrome a lê antes
        // do React montar — deixar para o setTheme abriria a janela com a
        // barra clara sobre um app escuro.
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', t === 'dark' ? '#262624' : '#faf9f5');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
