[package]
name = "app"
version = "0.1.0"
description = "Dito — app nativo para gravar reuniões (áudio do sistema + microfone)"
authors = ["Albiecloud"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3" }
tauri-plugin-log = "2"
tauri-plugin-fs = "2"

# Captura de áudio WASAPI (loopback + mic), ver Fase 2. O resample/downmix
# fica por conta do autoconvert do WASAPI em modo compartilhado (ver
# audio/mod.rs), então rubato não é necessário.
[target.'cfg(windows)'.dependencies]
wasapi = "0.24"
hound = "3.5"
crossbeam-channel = "0.5"
