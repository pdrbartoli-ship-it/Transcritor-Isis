<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Confirmando seu e-mail — Dito</title>
  <style>
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #faf9f7; color: #3d3a36;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    p { font-size: 15px; }
  </style>
</head>
<body>
  <p>Confirmando seu e-mail…</p>
  <script>
    // Esta página só existe porque o App Link precisa de uma URL real: quando o
    // Dito está instalado, o Android intercepta antes daqui e abre o app. Sem o
    // app (ou no desktop), o navegador cai aqui e a confirmação segue no site.
    // Os parâmetros vêm na query e o app usa rotas em hash, daí o repasse.
    var params = window.location.search.slice(1);
    window.location.replace('/#/confirm' + (params ? '?' + params : ''));
  </script>
</body>
</html>
