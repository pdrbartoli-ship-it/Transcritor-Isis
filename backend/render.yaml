services:
  - type: web
    name: escreve-backend
    runtime: python
    rootDir: backend
    # O deno é o runtime JS que o yt-dlp usa para resolver os desafios de
    # assinatura do YouTube; sem ele o download de vídeo falha.
    buildCommand: apt-get install -y ffmpeg && curl -fsSL https://deno.land/install.sh | DENO_INSTALL=/opt/render/project/.deno sh -s -- -y --no-modify-path && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      # Exigir login nas rotas que gastam crédito de IA. Ligada desde
      # 2026-09-03 — o parque de apps (Android, Windows) já estava atualizado
      # o bastante para não deixar ninguém de fora. Ficou desligada até aqui
      # de propósito: o valor abaixo é o que o Render aplica em cada
      # blueprint sync, então precisa continuar refletindo o painel — se
      # algum dia for preciso desligar nas duas pontas, mude aqui e no
      # painel (Environment) juntos, senão um sync desfaz o outro.
      - key: REQUIRE_AUTH
        value: "true"
      - key: GROQ_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: YOUTUBE_COOKIES
        sync: false
      - key: SUPADATA_API_KEY
        sync: false
